<title>Colditz Escape — AI Speedrun</title>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161d;
    --panel-2: #171c25;
    --border: #232a36;
    --text: #e8ecf4;
    --dim: #7f8ba0;
    --accent: #4fd1c5;
    --accent-2: #f6c453;
    --danger: #ff5d5d;
    --dir: #5b9dff;
    --action: #4fd1c5;
    --walk: #b98bff;
    --say: #ff8fd1;
    --control: #f6c453;
    --misc: #7f8ba0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 1.05fr 0.92fr 1fr;
    grid-template-rows: 100vh;
    height: 100vh;
  }

  /* ---------- LEFT: game view + timers ---------- */
  .left {
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .brand h1 {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0;
    font-weight: 700;
  }
  .brand h1 b { color: var(--text); }
  #offline-badge {
    display: none;
    background: var(--danger);
    color: #1a0505;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 4px;
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  .screen-wrap {
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screen {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    display: block;
  }
  .screen-offline-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: repeating-linear-gradient(135deg, #1a0505, #1a0505 12px, #200707 12px, #200707 24px);
  }
  .screen-offline-overlay span {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--danger);
    text-shadow: 0 0 18px rgba(255,93,93,0.6);
  }
  .status-msg {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--accent-2);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    letter-spacing: 0.04em;
    min-height: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rec-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #rec-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #rec-toggle:hover { border-color: var(--dim); color: var(--text); }
  #rec-toggle .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--dim);
    flex: 0 0 auto;
  }
  #rec-toggle.on {
    background: rgba(255,93,93,0.14);
    border-color: rgba(255,93,93,0.55);
    color: var(--danger);
  }
  #rec-toggle.on .dot {
    background: var(--danger);
    box-shadow: 0 0 8px rgba(255,93,93,0.8);
    animation: pulse 1s infinite;
  }
  #rec-toggle.pending { opacity: 0.6; cursor: wait; pointer-events: none; }
  #rec-file {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rec-warn {
    display: none;
    background: rgba(246,196,83,0.16);
    border: 1px solid rgba(246,196,83,0.5);
    color: var(--accent-2);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.4;
  }
  .rec-warn.show { display: block; }

  .timers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .timer-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px 14px;
    text-align: center;
  }
  .timer-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--dim);
    font-weight: 700;
  }
  .timer-value {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  #rta-value { color: var(--accent); }
  #igt-value { color: var(--accent-2); }
  .timer-box.stopped #rta-value { color: var(--dim); }
  .timer-box.stopped #igt-value { color: var(--dim); }
  .timer-sub {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.06em;
  }

  /* ---------- MIDDLE: castle map ---------- */
  .mid {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    border-right: 1px solid var(--border);
  }
  .map-panel {
    flex: 1 1 62%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
  }
  .room-panel {
    flex: 0 0 232px;
    display: flex;
    flex-direction: column;
  }
  .map-hdr { color: var(--accent-2); }
  .room-hdr { color: var(--dir); }

  .map-roster {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .roster-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 12px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .roster-chip.current { box-shadow: 0 0 0 2px var(--control); }
  .roster-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .roster-chip .off { color: var(--dim); font-weight: 400; font-size: 9px; margin-left: 1px; }
  .roster-empty { color: var(--dim); font-size: 11px; font-style: italic; padding: 2px 4px; }

  .map-canvas-wrap, .room-canvas-wrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    background: #05070a;
  }
  #map-canvas, #room-canvas { display: block; width: 100%; height: 100%; }

  .map-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
    padding: 6px 12px;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.02em;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .map-legend .lg-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .map-legend .sw { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
  .map-legend .sw.dashed { border-top-style: dashed; }
  .map-legend .sw.dotted { border-top-style: dotted; }
  .map-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ---------- RIGHT: feeds ---------- */
  .right {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }
  .feed-panel {
    flex: 1 1 50%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
  }
  .feed-panel:last-child { border-bottom: none; }
  .feed-header {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--dim);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .feed-header.reasoning-hdr { color: var(--accent); }
  .feed-header.commands-hdr { color: var(--action); }
  .feed-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .feed-body::-webkit-scrollbar { width: 8px; }
  .feed-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-hint {
    color: var(--dim);
    font-size: 12px;
    padding: 8px 4px;
    font-style: italic;
  }

  /* reasoning entries */
  .r-entry {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadein 0.25s ease-out;
  }
  .r-entry.type-say { border-left-color: var(--say); }
  .r-entry.type-split { border-left-color: var(--accent-2); }
  .r-entry .r-meta {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.08em;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .r-entry .r-text { color: var(--text); word-break: break-word; }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* command chips */
  .c-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadein 0.25s ease-out;
  }
  .c-entry .c-time {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    color: var(--dim);
    min-width: 46px;
    text-align: right;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border: 1px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.dir     { background: rgba(91,157,255,0.14);  color: var(--dir);     border-color: rgba(91,157,255,0.35); }
  .chip.action  { background: rgba(79,209,197,0.14);  color: var(--action);  border-color: rgba(79,209,197,0.35); }
  .chip.walk    { background: rgba(185,139,255,0.14); color: var(--walk);    border-color: rgba(185,139,255,0.35); }
  .chip.say     { background: rgba(255,143,209,0.14); color: var(--say);     border-color: rgba(255,143,209,0.35); }
  .chip.control { background: rgba(246,196,83,0.16);  color: var(--control); border-color: rgba(246,196,83,0.4); }
  .chip.misc    { background: rgba(127,139,160,0.14); color: var(--misc);    border-color: rgba(127,139,160,0.35); }
  .chip .glyph  { font-size: 15px; }

  /* fresh-fire flash: newest chip gets a brief highlight ring */
  .c-entry.fresh .chip { box-shadow: 0 0 0 2px currentColor; }
</style>

<div class="app">
  <div class="left">
    <div class="brand">
      <h1><b>COLDITZ ESCAPE</b> — AI SPEEDRUN</h1>
      <div id="offline-badge">GAME OFFLINE</div>
    </div>

    <div class="screen-wrap">
      <img id="screen" src="/api/screen" alt="game screen">
      <div class="screen-offline-overlay" id="screen-offline"><span>GAME OFFLINE</span></div>
    </div>

    <div class="status-msg" id="status-msg">&nbsp;</div>

    <div class="rec-row">
      <button type="button" id="rec-toggle">
        <span class="dot"></span><span id="rec-label">REC OFF</span>
      </button>
      <span id="rec-file"></span>
    </div>
    <div class="rec-warn" id="rec-warn"></div>

    <div class="timers">
      <div class="timer-box" id="rta-box">
        <div class="timer-label">RTA</div>
        <div class="timer-value" id="rta-value">0:00.0</div>
        <div class="timer-sub" id="rta-sub">waiting for run-start</div>
      </div>
      <div class="timer-box" id="igt-box">
        <div class="timer-label">IGT</div>
        <div class="timer-value" id="igt-value">—</div>
        <div class="timer-sub" id="igt-sub">waiting for run-start</div>
      </div>
    </div>
  </div>

  <div class="mid">
    <div class="feed-panel map-panel">
      <div class="feed-header map-hdr">CASTLE MAP</div>
      <div class="map-roster" id="map-roster"><span class="roster-empty">waiting for game state…</span></div>
      <div class="map-canvas-wrap">
        <canvas id="map-canvas"></canvas>
      </div>
      <div class="map-legend">
        <span class="lg-item"><span class="sw" style="border-color:#3a4356;"></span>open</span>
        <span class="lg-item"><span class="sw dashed" style="border-color:#ff5d5d;"></span>blocked</span>
        <span class="lg-item"><span class="sw dotted" style="border-color:#5a6478;"></span>untested</span>
        <span class="lg-item"><span class="dot" style="background:#3ddc84;"></span>GB</span>
        <span class="lg-item"><span class="dot" style="background:#5b9dff;"></span>FR</span>
        <span class="lg-item"><span class="dot" style="background:#c2b451;"></span>US</span>
        <span class="lg-item"><span class="dot" style="background:#e0435f;"></span>PL</span>
      </div>
    </div>
    <div class="feed-panel room-panel">
      <div class="feed-header room-hdr">CURRENT ROOM</div>
      <div class="room-canvas-wrap">
        <canvas id="room-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="feed-panel">
      <div class="feed-header reasoning-hdr">REASONING — FABLE'S BRAIN</div>
      <div class="feed-body" id="reasoning-feed">
        <div class="empty-hint">no reasoning events yet</div>
      </div>
    </div>
    <div class="feed-panel">
      <div class="feed-header commands-hdr">COMMANDS — HAIKU'S HANDS</div>
      <div class="feed-body" id="commands-feed">
        <div class="empty-hint">no commands yet</div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const MAX_FEED = 50;

  const DIR_GLYPH = { up: "↑", down: "↓", left: "←", right: "→" };
  const REASONING_TYPES = new Set(["reason", "say", "split"]);

  let sinceIndex = 0;

  let runStartTs = null; // seconds (epoch.ms float)
  let runStopTs = null;

  // IGT (in-game time) baseline: run-relative, not raw game uptime. Set
  // from the `igt0` field on the most recent run-start event. Null means
  // "no baseline known yet" -> display "—".
  let igtBaselineMs = null;
  let runStopFinalIgtMs = null; // frozen IGT elapsed at run-stop, if known
  let lastGameTimeMs = null;    // last game_time seen from /api/state

  let gameOnline = true; // last known reachability, from /api/state polling

  // ---------- helpers ----------

  function fmtDuration(totalSeconds) {
    // H:MM:SS when >= 1 hour, else M:SS. Negative/garbage clamps to 0.
    if (!(totalSeconds >= 0)) totalSeconds = 0;
    totalSeconds = Math.floor(totalSeconds);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if (h >= 1) {
      return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }
    return m + ":" + String(s).padStart(2, "0");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function timeOfDay(ts) {
    const d = new Date(ts * 1000);
    return d.toTimeString().slice(0, 8);
  }

  // ---------- log polling ----------
  //
  // Incremental only: /api/log?since=N returns just the events appended
  // since the last poll. We track `next` and request only new events, then
  // APPEND their DOM nodes (never rebuild the containers). A poll that
  // returns zero events performs zero DOM mutations - nothing to diff,
  // nothing to flicker.

  function htmlToNode(html) {
    const tmpl = document.createElement("template");
    tmpl.innerHTML = html.trim();
    return tmpl.content.firstElementChild;
  }

  function removeEmptyHint(el) {
    const hint = el.querySelector(".empty-hint");
    if (hint) hint.remove();
  }

  function trimFeed(el, max) {
    while (el.children.length > max) {
      el.removeChild(el.lastElementChild);
    }
  }

  function reasoningEntryHtml(ev) {
    const label = ev.type === "run-start" ? "RUN START"
      : ev.type === "run-stop" ? "RUN STOP"
      : ev.type === "split" ? "SPLIT"
      : ev.type === "say" ? "SAY"
      : "REASON";
    return '<div class="r-entry type-' + escapeHtml(ev.type) + '">' +
      '<div class="r-meta"><span>' + label + '</span><span>' + timeOfDay(ev.ts) + '</span></div>' +
      '<div class="r-text">' + escapeHtml(ev.text || "") + '</div>' +
      '</div>';
  }

  function appendReasoningEntry(ev) {
    const el = document.getElementById("reasoning-feed");
    removeEmptyHint(el);
    el.insertBefore(htmlToNode(reasoningEntryHtml(ev)), el.firstChild);
    trimFeed(el, MAX_FEED);
  }

  function appendCommandEntry(ev) {
    const el = document.getElementById("commands-feed");
    removeEmptyHint(el);
    const prevFirst = el.firstElementChild;
    const html = '<div class="c-entry fresh">' +
      '<span class="c-time">' + timeOfDay(ev.ts) + '</span>' +
      chipForCommand(ev) +
      '</div>';
    el.insertBefore(htmlToNode(html), el.firstChild);
    if (prevFirst) prevFirst.classList.remove("fresh");
    trimFeed(el, MAX_FEED);
  }

  function updateIgtDisplay() {
    const valueEl = document.getElementById("igt-value");
    const subEl = document.getElementById("igt-sub");
    const box = document.getElementById("igt-box");

    if (igtBaselineMs === null) {
      valueEl.textContent = "—";
      subEl.textContent = "waiting for run-start";
      box.classList.remove("stopped");
      return;
    }

    if (runStopTs !== null && runStopFinalIgtMs !== null) {
      valueEl.textContent = fmtDuration(runStopFinalIgtMs / 1000);
      subEl.textContent = "final";
      box.classList.add("stopped");
      return;
    }

    box.classList.remove("stopped");
    if (lastGameTimeMs === null) {
      valueEl.textContent = "—";
      subEl.textContent = "waiting for game state";
      return;
    }
    const elapsedMs = lastGameTimeMs - igtBaselineMs;
    valueEl.textContent = fmtDuration(elapsedMs / 1000);
    subEl.textContent = "run time";
  }

  function ingestEvent(ev) {
    const type = ev.type;

    if (type === "run-start") {
      if (runStartTs === null || ev.ts >= runStartTs) {
        runStartTs = ev.ts;
        runStopTs = null; // a new run-start supersedes any prior stop
        runStopFinalIgtMs = null;
        igtBaselineMs = (typeof ev.igt0 === "number" && isFinite(ev.igt0)) ? ev.igt0 : null;
        updateIgtDisplay();
      }
    } else if (type === "run-stop") {
      if (runStopTs === null || ev.ts >= runStopTs) {
        runStopTs = ev.ts;
        if (typeof ev.igt_ms === "number" && isFinite(ev.igt_ms)) {
          runStopFinalIgtMs = ev.igt_ms;
        } else if (igtBaselineMs !== null && lastGameTimeMs !== null) {
          runStopFinalIgtMs = lastGameTimeMs - igtBaselineMs;
        } else {
          runStopFinalIgtMs = null;
        }
        updateIgtDisplay();
      }
    }

    if (REASONING_TYPES.has(type) || type === "run-start" || type === "run-stop") {
      appendReasoningEntry(ev);
    }
    if (type === "cmd") {
      appendCommandEntry(ev);
    }
  }

  function chipForCommand(ev) {
    const endpoint = ev.endpoint || "";
    const body = ev.body;
    let cls = "misc";
    let inner = escapeHtml(endpoint.toUpperCase());

    if (endpoint === "input" && body && typeof body === "object") {
      const key = body.key || "?";
      const ms = body.ms !== undefined ? body.ms : "";
      if (DIR_GLYPH[key]) {
        cls = "dir";
        inner = '<span class="glyph">' + DIR_GLYPH[key] + '</span>' + key.toUpperCase() +
          (ms !== "" ? " " + ms + "ms" : "");
      } else {
        cls = "action";
        inner = key.toUpperCase() + (ms !== "" ? " " + ms + "ms" : "");
      }
    } else if (endpoint === "walk" && body && typeof body === "object") {
      cls = "walk";
      if (body.cancel) {
        inner = "WALK → cancel";
      } else if (body.exit !== undefined) {
        inner = "WALK → exit " + body.exit;
      } else if (body.tile !== undefined) {
        inner = "WALK → [" + body.tile[0] + "," + body.tile[1] + "]";
      } else {
        inner = "WALK";
      }
    } else if (endpoint === "say" && body && typeof body === "object") {
      cls = "say";
      inner = '\u{1F4AC} “' + escapeHtml(body.text || "") + '”';
    } else if (endpoint === "control") {
      cls = "control";
      let detail = "";
      if (body && typeof body === "object") {
        if (body.pause !== undefined) detail = body.pause ? "PAUSE" : "UNPAUSE";
        else if (body.speed !== undefined) detail = "SPEED " + body.speed;
      }
      inner = "⚠ CONTROL" + (detail ? " " + detail : "");
    } else if (endpoint === "state" || endpoint === "screen" || endpoint === "room") {
      cls = "misc";
      inner = endpoint.toUpperCase();
    } else if (body && typeof body === "object" && Object.keys(body).length) {
      inner = endpoint.toUpperCase() + " " + escapeHtml(JSON.stringify(body));
    }

    return '<span class="chip ' + cls + '">' + inner + '</span>';
  }

  function pollLog() {
    fetch("/api/log?since=" + sinceIndex, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        sinceIndex = data.next;
        // No new events -> forEach body never runs -> zero DOM mutations.
        (data.events || []).forEach(ingestEvent);
      })
      .catch(function () { /* transient - next poll will retry */ })
      .finally(function () { setTimeout(pollLog, 700); });
  }

  // ---------- RTA ticking (client-side, driven by run-start/run-stop ts) ----------

  function tickRta() {
    const box = document.getElementById("rta-box");
    const valueEl = document.getElementById("rta-value");
    const subEl = document.getElementById("rta-sub");

    if (runStartTs === null) {
      valueEl.textContent = "0:00";
      subEl.textContent = "waiting for run-start";
      box.classList.remove("stopped");
      return;
    }

    if (runStopTs !== null && runStopTs >= runStartTs) {
      const finalSecs = runStopTs - runStartTs;
      valueEl.textContent = fmtDuration(finalSecs);
      subEl.textContent = "final";
      box.classList.add("stopped");
      return;
    }

    box.classList.remove("stopped");
    const nowSecs = Date.now() / 1000;
    const elapsed = nowSecs - runStartTs;
    valueEl.textContent = fmtDuration(elapsed);
    subEl.textContent = "running";
  }

  // ---------- IGT + state polling ----------

  function setOffline(offline) {
    gameOnline = !offline;
    document.getElementById("offline-badge").style.display = offline ? "inline-block" : "none";
    document.getElementById("screen-offline").style.display = offline ? "flex" : "none";
  }

  function pollState() {
    fetch("/api/state", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("state proxy error " + r.status);
        return r.json();
      })
      .then(function (data) {
        setOffline(false);
        lastGameTimeMs = typeof data.game_time === "number" ? data.game_time : null;
        updateIgtDisplay();
        const msg = (data.message || "").trim();
        document.getElementById("status-msg").textContent = msg.length ? msg : " ";
      })
      .catch(function () {
        setOffline(true);
      })
      .finally(function () { setTimeout(pollState, 1000); });
  }

  // ---------- screen refresh ----------

  function refreshScreen() {
    const img = document.getElementById("screen");
    const next = "/api/screen?t=" + Date.now();
    const probe = new Image();
    probe.onload = function () {
      img.src = next;
      setOffline(false);
    };
    probe.onerror = function () {
      setOffline(true);
    };
    probe.src = next;
  }

  // ---------- recording toggle ----------
  //
  // Recording is OFF by default and only ever turned on by an explicit
  // click. The button reflects the server's last-known truth: every click
  // fires the start/stop request, and a 2s poll of /api/record/status keeps
  // the UI honest even if the recorder fails asynchronously (e.g. dies
  // mid-run) or another client toggled it.

  let recRecording = false;
  let recPending = false;

  function basename(p) {
    if (!p) return "";
    const parts = String(p).split("/");
    return parts[parts.length - 1];
  }

  function renderRec(state) {
    const btn = document.getElementById("rec-toggle");
    const label = document.getElementById("rec-label");
    const fileEl = document.getElementById("rec-file");
    const warnEl = document.getElementById("rec-warn");

    recRecording = !!state.recording;
    btn.classList.toggle("on", recRecording);
    btn.classList.toggle("pending", recPending);
    label.textContent = recRecording ? "● REC" : "REC OFF";
    fileEl.textContent = recRecording ? basename(state.file) : "";

    if (state.error) {
      warnEl.textContent = "⚠ RECORDING: " + state.error;
      warnEl.classList.add("show");
    } else {
      warnEl.classList.remove("show");
      warnEl.textContent = "";
    }
  }

  function pollRecordStatus() {
    fetch("/api/record/status", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!recPending) renderRec(data);
      })
      .catch(function () { /* transient - next poll will retry */ })
      .finally(function () { setTimeout(pollRecordStatus, 2000); });
  }

  function toggleRec() {
    if (recPending) return;
    recPending = true;
    document.getElementById("rec-toggle").classList.add("pending");
    const endpoint = recRecording ? "/api/record/stop" : "/api/record/start";
    fetch(endpoint, { method: "POST", cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        recPending = false;
        renderRec(data);
      })
      .catch(function () {
        recPending = false;
        document.getElementById("rec-toggle").classList.remove("pending");
      });
  }

  document.getElementById("rec-toggle").addEventListener("click", toggleRec);

  // ---------- boot ----------

  setInterval(tickRta, 100);
  setInterval(refreshScreen, 2000);
  pollLog();
  pollState();
  refreshScreen();
  pollRecordStatus();
})();

// ---------- CASTLE MAP + CURRENT ROOM ----------
//
// Self-contained subsystem: polls /api/map (parsed campaign/map.md, always
// available - independent of the game API), /api/state (prisoner
// positions), and /api/room (current room grid). Deliberately isolated from
// the feed/timer IIFE above so a hiccup in one never touches the other, and
// so the game API's restarts (a separate workstream may bounce it) only
// ever gray out the live-position layers, never the discovered graph.
(function () {
  "use strict";

  const NATION_COLOR = {
    british: "#3ddc84",   // GB - green
    french: "#5b9dff",    // FR - blue
    american: "#c2b451",  // US - olive
    polish: "#e0435f",    // PL - red
  };
  const NATION_ABBR = { british: "GB", french: "FR", american: "US", polish: "PL" };

  // ---------- layout: layered-by-discovery-order, cached in localStorage ----------
  //
  // Rooms arrive from /api/map in file order == discovery order (map.md is
  // appended to as new rooms are found). New rooms get the next free grid
  // slot; existing rooms keep whatever slot they were first assigned, read
  // back from localStorage, so the layout never jumps between polls/reloads.

  const LAYOUT_KEY = "colditz_map_layout_v1";
  const NODE_W = 70, NODE_H = 36;
  const GRID_W = 150, GRID_H = 96;
  const COLS = 4;

  let layoutCache = {};
  try { layoutCache = JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}; } catch (e) { layoutCache = {}; }

  function saveLayout() {
    try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layoutCache)); } catch (e) { /* storage disabled/full - ignore */ }
  }

  function assignPositions(rooms) {
    let usedSlots = Object.keys(layoutCache).length;
    let changed = false;
    rooms.forEach(function (r) {
      if (!layoutCache[r.id]) {
        const slot = usedSlots++;
        const col = slot % COLS;
        const row = Math.floor(slot / COLS);
        layoutCache[r.id] = { x: col * GRID_W, y: row * GRID_H };
        changed = true;
      }
    });
    if (changed) saveLayout();
  }

  // ---------- data ----------

  let mapRooms = [];
  let mapEdges = [];
  let roomsById = {};
  let mapOk = false;

  let lastPrisoners = null;
  let lastCurrentPrisoner = 0;
  let gameLive = false;

  let roomData = null;
  let roomLive = false;

  // ---------- canvas helpers ----------

  function fitCanvas(canvas) {
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, wrap.clientWidth), h = Math.max(1, wrap.clientHeight);
    const pxW = Math.round(w * dpr), pxH = Math.round(h * dpr);
    if (canvas.width !== pxW || canvas.height !== pxH) {
      canvas.width = pxW;
      canvas.height = pxH;
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Deterministic pseudo-angle for a blocked/untested exit stub, derived
  // from room id + tile coords, so the same exit always points the same
  // way between polls.
  function stubAngle(rid, tile) {
    const h = ((rid * 131) ^ ((tile[0] * 17 + tile[1] * 29 + 7) * 97)) >>> 0;
    return (h % 360) * Math.PI / 180;
  }

  // ---------- castle map ----------

  function computeBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    mapRooms.forEach(function (r) {
      const p = layoutCache[r.id];
      if (!p) return;
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x + NODE_W);
      maxY = Math.max(maxY, p.y + NODE_H);
    });
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = NODE_W; maxY = NODE_H; }
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  function drawCastleMap(now) {
    const canvas = document.getElementById("map-canvas");
    if (!canvas) return;
    const fit = fitCanvas(canvas);
    const ctx = fit.ctx;
    ctx.clearRect(0, 0, fit.w, fit.h);

    if (!mapRooms.length) {
      ctx.fillStyle = "#4a5266";
      ctx.font = "12px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(mapOk ? "no rooms discovered yet" : "map.md unavailable", fit.w / 2, fit.h / 2);
      return;
    }

    const b = computeBounds();
    const pad = 34;
    const scaleX = (fit.w - pad * 2) / Math.max(1, b.maxX - b.minX);
    const scaleY = (fit.h - pad * 2) / Math.max(1, b.maxY - b.minY);
    const scale = Math.max(0.35, Math.min(1.5, Math.min(scaleX, scaleY)));

    function tx(x) { return pad + (x - b.minX) * scale; }
    function ty(y) { return pad + (y - b.minY) * scale; }

    const currentRoomId = (lastPrisoners && gameLive) ? lastPrisoners[lastCurrentPrisoner].room : null;

    // edges (open/traversed connections)
    mapEdges.forEach(function (e) {
      const pf = layoutCache[e.from], pt = layoutCache[e.to];
      if (!pf || !pt) return;
      const x1 = tx(pf.x + NODE_W / 2), y1 = ty(pf.y + NODE_H / 2);
      const x2 = tx(pt.x + NODE_W / 2), y2 = ty(pt.y + NODE_H / 2);
      ctx.save();
      ctx.strokeStyle = "#3a4356";
      ctx.fillStyle = "#3a4356";
      ctx.lineWidth = 1.6;
      if (e.from === e.to) {
        // self-loop (internal exit) - small arc above the node
        const cy = y1 - (NODE_H * scale) * 0.9;
        ctx.beginPath();
        ctx.arc(x1, cy, 8, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const hx = x2 - Math.cos(ang) * (NODE_W * scale * 0.5);
        const hy = y2 - Math.sin(ang) * (NODE_H * scale * 0.7);
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx - 7 * Math.cos(ang - 0.4), hy - 7 * Math.sin(ang - 0.4));
        ctx.lineTo(hx - 7 * Math.cos(ang + 0.4), hy - 7 * Math.sin(ang + 0.4));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    });

    // blocked (red dashed) / untested (grey dotted) exit stubs
    mapRooms.forEach(function (r) {
      const p = layoutCache[r.id];
      if (!p) return;
      const cx = tx(p.x + NODE_W / 2), cy = ty(p.y + NODE_H / 2);
      (r.exits || []).forEach(function (ex) {
        if (ex.status !== "blocked" && ex.status !== "untested") return;
        const ang = stubAngle(r.id, ex.tile);
        const x1 = cx + Math.cos(ang) * (NODE_W * scale * 0.5);
        const y1 = cy + Math.sin(ang) * (NODE_H * scale * 0.5);
        const x2 = x1 + Math.cos(ang) * 15;
        const y2 = y1 + Math.sin(ang) * 15;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        if (ex.status === "blocked") {
          ctx.strokeStyle = "#ff5d5d";
          ctx.setLineDash([4, 3]);
        } else {
          ctx.strokeStyle = "#5a6478";
          ctx.setLineDash([1.5, 3]);
        }
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();
      });
    });

    // room nodes
    mapRooms.forEach(function (r) {
      const p = layoutCache[r.id];
      if (!p) return;
      const x = tx(p.x), y = ty(p.y);
      const w = NODE_W * scale, h = NODE_H * scale;
      const isCurrent = currentRoomId === r.id;

      if (isCurrent) {
        ctx.save();
        roundRect(ctx, x - 4, y - 4, w + 8, h + 8, 8);
        ctx.strokeStyle = "#f6c453";
        ctx.lineWidth = 2.4;
        ctx.globalAlpha = 0.5 + Math.sin(now / 220) * 0.3;
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      roundRect(ctx, x, y, w, h, 6);
      ctx.fillStyle = isCurrent ? "#1c2130" : "#171c25";
      ctx.fill();
      ctx.strokeStyle = isCurrent ? "#f6c453" : "#2c3446";
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#e8ecf4";
      ctx.font = "bold " + Math.max(9, Math.round(11 * scale)) + "px 'SF Mono', Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(r.id), x + w / 2, y + h * 0.36);

      // prisoners currently in this room
      if (lastPrisoners && gameLive) {
        const here = [];
        lastPrisoners.forEach(function (pr, idx) { if (pr.room === r.id) here.push(idx); });
        const n = here.length;
        const dy = y + h * 0.76;
        here.forEach(function (idx, i) {
          const dotR = Math.max(2.2, 3.2 * scale);
          const dx = n === 1 ? x + w / 2 : x + w * (0.2 + i * (0.6 / (n - 1)));
          const pr = lastPrisoners[idx];
          const color = NATION_COLOR[pr.nation] || "#aaaaaa";
          const isMe = idx === lastCurrentPrisoner;
          if (isMe) {
            const ringR = dotR + 3 + Math.sin(now / 180) * 1.4;
            ctx.beginPath();
            ctx.arc(dx, dy, ringR, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          ctx.beginPath();
          ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#05070a";
          ctx.stroke();
        });
      }
    });
  }

  // ---------- roster strip ----------

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderRoster() {
    const el = document.getElementById("map-roster");
    if (!el) return;
    if (!lastPrisoners || !gameLive) {
      el.innerHTML = '<span class="roster-empty">live positions offline</span>';
      return;
    }
    let html = "";
    lastPrisoners.forEach(function (pr, idx) {
      const color = NATION_COLOR[pr.nation] || "#aaaaaa";
      const abbr = NATION_ABBR[pr.nation] || String(pr.nation || "??").slice(0, 2).toUpperCase();
      const onMap = !!roomsById[pr.room];
      const cur = idx === lastCurrentPrisoner;
      html += '<span class="roster-chip' + (cur ? " current" : "") + '">' +
        '<span class="dot" style="background:' + color + '"></span>' +
        escapeHtml(abbr) + " " + escapeHtml(pr.room) +
        (onMap ? "" : '<span class="off">off-map</span>') +
        '</span>';
    });
    el.innerHTML = html;
  }

  // ---------- current room inset ----------

  function drawRoomInset(now) {
    const canvas = document.getElementById("room-canvas");
    if (!canvas) return;
    const fit = fitCanvas(canvas);
    const ctx = fit.ctx;
    ctx.clearRect(0, 0, fit.w, fit.h);

    if (!roomLive || !roomData || !roomData.grid || !roomData.grid.length) {
      ctx.fillStyle = "#4a5266";
      ctx.font = "12px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(roomLive ? "no room data" : "GAME OFFLINE", fit.w / 2, fit.h / 2);
      return;
    }

    const grid = roomData.grid;
    const rows = grid.length;
    const cols = grid[0].length;
    if (!rows || !cols) return;

    const pad = 8;
    const cell = Math.max(2, Math.floor(Math.min((fit.w - pad * 2) / cols, (fit.h - pad * 2) / rows)));
    const ox = (fit.w - cell * cols) / 2;
    const oy = (fit.h - cell * rows) / 2;

    for (let ry = 0; ry < rows; ry++) {
      const row = grid[ry];
      for (let cx = 0; cx < cols; cx++) {
        const ch = row[cx];
        let color;
        if (ch === "#") color = "#262c3a";       // floor
        else if (ch === "E") color = "#c98a3e";  // door
        else color = "#05070a";                  // dark / void ('.')
        ctx.fillStyle = color;
        ctx.fillRect(ox + cx * cell, oy + ry * cell, Math.max(1, cell - 1), Math.max(1, cell - 1));
      }
    }

    (roomData.items || []).forEach(function (it) {
      if (!it.tile) return;
      const px = ox + it.tile[0] * cell + cell / 2;
      const py = oy + it.tile[1] * cell + cell / 2;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(2, cell * 0.22), 0, Math.PI * 2);
      ctx.fillStyle = "#f6c453";
      ctx.fill();
    });

    if (roomData.my_tile) {
      const pr = (lastPrisoners && lastPrisoners[lastCurrentPrisoner]) ? lastPrisoners[lastCurrentPrisoner] : null;
      const color = NATION_COLOR[pr && pr.nation] || "#e8ecf4";
      const px = ox + roomData.my_tile[0] * cell + cell / 2;
      const py = oy + roomData.my_tile[1] * cell + cell / 2;
      const ringR = Math.max(3, cell * 0.32) + Math.sin(now / 180) * 1.4;
      ctx.beginPath();
      ctx.arc(px, py, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.65;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(2, cell * 0.22), 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }
  }

  // ---------- polling ----------
  //
  // /api/map is read straight from map.md server-side and has no
  // dependency on the game API - it keeps rendering the discovered graph
  // even while the game process is bounced by another workstream. Only
  // /api/state (prisoner dots/roster) and /api/room (inset) gray out.

  function pollMap() {
    fetch("/api/map", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        mapOk = true;
        mapRooms = data.rooms || [];
        mapEdges = data.edges || [];
        roomsById = {};
        mapRooms.forEach(function (r) { roomsById[r.id] = r; });
        assignPositions(mapRooms);
      })
      .catch(function () { /* transient - keep last-known graph */ })
      .finally(function () { setTimeout(pollMap, 1000); });
  }

  function pollMapState() {
    fetch("/api/state", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("state proxy error " + r.status);
        return r.json();
      })
      .then(function (data) {
        gameLive = true;
        lastPrisoners = data.prisoners || null;
        lastCurrentPrisoner = typeof data.current_prisoner === "number" ? data.current_prisoner : 0;
        renderRoster();
      })
      .catch(function () {
        gameLive = false;
        renderRoster();
      })
      .finally(function () { setTimeout(pollMapState, 1000); });
  }

  function pollRoom() {
    fetch("/api/room", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("room proxy error " + r.status);
        return r.json();
      })
      .then(function (data) {
        roomLive = true;
        roomData = data;
      })
      .catch(function () {
        roomLive = false;
      })
      .finally(function () { setTimeout(pollRoom, 1000); });
  }

  function loop() {
    const now = performance.now();
    drawCastleMap(now);
    drawRoomInset(now);
    requestAnimationFrame(loop);
  }

  pollMap();
  pollMapState();
  pollRoom();
  requestAnimationFrame(loop);
})();
</script>
